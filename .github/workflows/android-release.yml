# Builds and publishes TheraPano Android APK as a GitHub Release
name: Android Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (z.B. 1.2.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Test runner
        run: echo "Runner is working!"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Flutter (stable)
        run: |
          FLUTTER_JSON=$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json)
          FLUTTER_VERSION=$(echo "$FLUTTER_JSON" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          latest = d['releases'][0]['version']
          print(latest)
          ")
          echo "Latest Flutter: $FLUTTER_VERSION"
          curl -sL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            -o /tmp/flutter.tar.xz
          tar -xf /tmp/flutter.tar.xz -C /opt/
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Flutter Version Info
        run: flutter --version

      - name: Get Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Extract Version from pubspec.yaml
        id: version
        working-directory: flutter_app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | cut -d'+' -f2)
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD" >> $GITHUB_OUTPUT
          echo "Version: $VERSION+$BUILD"

      - name: Determine Release Tag
        id: release_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            TAG="v${{ github.event.inputs.version_name }}"
          else
            TAG="v${{ steps.version.outputs.version_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release Tag: $TAG"

      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK and generate release notes
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          mkdir -p dist
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
             "dist/TheraPano-${VERSION}+${BUILD}-android.apk"
          cat <<EOF > dist/release_notes.md
          ## TheraPano Android ${VERSION} (Build ${BUILD})

          ### Installation
          1. APK-Datei auf dein Android-Gerät laden
          2. In den Einstellungen **"Unbekannte Quellen"** erlauben
          3. APK öffnen und installieren

          ### Systemanforderungen
          - Android 5.0 (API 21) oder höher
          - ca. 50 MB freier Speicherplatz

          ### Enthaltene Funktionen
          - Dashboard mit Tagesübersicht
          - Kalender & Terminverwaltung
          - Patientenverwaltung (Befunde, Behandlungen)
          - Rechnungen & Mahnungen
          - Nachrichten & Postfach
          - Besitzerportal
          - Offline-3D-Schmerzanalyse
          - Hausaufgaben für Tierbesitzer
          - Push-Benachrichtigungen
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version_name }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          APK="dist/TheraPano-${VERSION}+${BUILD}-android.apk"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TheraPano Android ${VERSION}" \
              --notes-file dist/release_notes.md
          fi
