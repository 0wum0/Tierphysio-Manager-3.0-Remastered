name: Android App
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['flutter_app/**', '.github/workflows/android-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check Dart compilation
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test app
        run: flutter test
      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          keys = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          production = all(os.environ.get(k) for k in keys)
          if any(os.environ.get(k) for k in keys) and not production:
              raise SystemExit('Android signing secrets are incomplete.')
          if production:
              Path('android/app/release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
              def prop(v):
                  return v.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace(' ', '\\ ')
              Path('android/key.properties').write_text('\n'.join([
                  'storeFile=release.jks', 'storePassword=' + prop(os.environ['STORE_PASSWORD']),
                  'keyAlias=' + prop(os.environ['KEY_ALIAS']), 'keyPassword=' + prop(os.environ['KEY_PASSWORD']),
              ]))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('production=' + str(production).lower() + '\n')
          PY
      - name: Build APK
        env:
          THERAPANO_PREVIEW: ${{ steps.signing.outputs.production != 'true' }}
        run: flutter build apk --release --no-tree-shake-icons
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TheraPano-android-${{ steps.signing.outputs.production == 'true' && 'release' || 'preview' }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed tagged release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.production == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/TheraPano-android.apk"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/TheraPano-android.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/TheraPano-android.apk" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/release.jks
